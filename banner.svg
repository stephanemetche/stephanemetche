<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-labelledby="t d">
  <title id="t">Stéphane Metche</title>
  <desc id="d">Bannière : administration systèmes, réseaux et sécurité, avec un schéma réseau animé</desc>
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2430" stroke-width="1"/>
    </pattern>
    <clipPath id="type">
      <rect x="48" y="186" width="0" height="30">
        <animate attributeName="width" from="0" to="330" dur="2.6s" begin="0.4s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="280" rx="14" fill="#0d1117"/>
  <rect width="1000" height="280" rx="14" fill="url(#grid)"/>
  <circle cx="780" cy="145" r="190" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="999" height="279" rx="14" fill="none" stroke="#30363d"/>

  <g font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace">
    <text x="48" y="52" font-size="13" fill="#6e7681">~/stephane/infra</text>
  </g>

  <text x="48" y="116" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#e6edf3">Stéphane Metche</text>
  <text x="48" y="152" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#9da7b3">Systèmes · Réseaux · Sécurité</text>

  <rect x="48" y="166" width="0" height="4" rx="2" fill="url(#acc)">
    <animate attributeName="width" from="0" to="150" dur="1.2s" begin="0.2s" fill="freeze"/>
  </rect>

  <g clip-path="url(#type)" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="17">
    <text x="48" y="208"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d1d9"> ssh admin@homelab </tspan><tspan fill="#58a6ff">--secure</tspan></text>
  </g>
  <rect x="384" y="192" width="9" height="19" fill="#58a6ff">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.56;0.95;1" dur="1s" begin="3s" repeatCount="indefinite"/>
  </rect>

  <g stroke="#2d3b4e" stroke-width="1.5" fill="none">
    <path d="M690 80 L780 150"/>
    <path d="M850 70 L780 150"/>
    <path d="M780 150 L680 215"/>
    <path d="M780 150 L890 210"/>
    <path d="M690 80 L850 70" stroke-dasharray="4 5" opacity="0.6"/>
  </g>

  <circle r="3.2" fill="#58a6ff">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M690 80 L780 150"/>
  </circle>
  <circle r="3.2" fill="#2dd4bf">
    <animateMotion dur="3.4s" begin="0.8s" repeatCount="indefinite" path="M850 70 L780 150"/>
  </circle>
  <circle r="3.2" fill="#58a6ff">
    <animateMotion dur="3s" begin="0.4s" repeatCount="indefinite" path="M780 150 L680 215"/>
  </circle>
  <circle r="3.2" fill="#2dd4bf">
    <animateMotion dur="3.6s" begin="1.2s" repeatCount="indefinite" path="M780 150 L890 210"/>
  </circle>

  <circle cx="780" cy="150" r="14" fill="none" stroke="#58a6ff" stroke-width="1.5">
    <animate attributeName="r" values="14;30" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <g fill="#0d1117" stroke="#58a6ff" stroke-width="2">
    <circle cx="690" cy="80" r="9"/>
    <circle cx="850" cy="70" r="9"/>
    <circle cx="680" cy="215" r="9"/>
    <circle cx="890" cy="210" r="9"/>
  </g>
  <circle cx="780" cy="150" r="14" fill="#0d1117" stroke="url(#acc)" stroke-width="2.5"/>
  <circle cx="780" cy="150" r="5" fill="#58a6ff"/>

  <g font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#8b949e">
    <text x="672" y="62">pare-feu</text>
    <text x="838" y="52">dns</text>
    <text x="640" y="244">docker</text>
    <text x="870" y="240">zabbix</text>
    <text x="755" y="188">srv-debian</text>
  </g>
</svg>
